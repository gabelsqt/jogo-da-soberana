name: Verificação do protótipo

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install
      - name: Verificar regras de combate e progressão
        run: npm test
      - name: Compilar jogo para navegador
        run: npm run build
