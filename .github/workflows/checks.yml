name: Verificação do protótipo

on:
  push:
    branches: [main]
  pull_request:

# Cada nova revisão substitui os jobs de PR anteriores da mesma branch.
# Evita acumular dezenas de builds enquanto o patch é refinado.
concurrency:
  group: soberana-checks-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install
      - name: Verificar regras de combate e progressão
        run: npm test
      - name: Compilar jogo e exportar HTML único para itch.io
        run: npm run build:itch
      - name: Verificar arquivo publicável
        run: |
          test -s itch-build/index.html
          if grep -E -q 'src=["\x27]\./assets/index-.*\.js' itch-build/index.html; then
            echo "Ainda há referência a JS externo no HTML único"
            exit 1
          fi

      - name: Disponibilizar jogo HTML para teste
        uses: actions/upload-artifact@v4
        with:
          name: soberana-v1-playtest
          path: itch-build/index.html
          retention-days: 14
