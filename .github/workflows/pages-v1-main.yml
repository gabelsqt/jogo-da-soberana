name: Game Soberana — Playtest v1 (Pages)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages-v1-main.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: soberana-v1-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter apenas a versão de teste da branch isolada
        uses: actions/checkout@v4
        with:
          ref: feat/brasil2-arraial-balístico
      - name: Confirmar revisão da árvore V1 Brasil 2 utilizada no site
        run: |
          echo "Publicando branch: $(git branch --show-current)"
          echo "Commit jogável: $(git rev-parse HEAD)"
          test -f src/scenes/V1PlaytestScene.js
          test -f src/gameplay/arraialBrasil2.js
          grep -q 'BUILD ARRAIAL' src/scenes/V1PlaytestScene.js
          grep -q 'ARENA LIVRE' src/scenes/V1PlaytestScene.js
          grep -q 'v1Playtest:true' src/scenes/V1PlaytestScene.js
          grep -q 'arenaIndex' src/scenes/V1PlaytestScene.js
          grep -q 'const ringCount = Math.min(ARRAIAL.ringCount, count)' src/gameplay/arraialBrasil2.js
          grep -q 'const paintFinal=' src/scenes/GameScene.js
          grep -q 'const paint=()=>' src/scenes/GameScene.js
          grep -q 'duration: 2200, fireworkCount: 20' src/gameplay/arraialBrasil2.js
          grep -q 'fireworkRadius: 37' src/gameplay/arraialBrasil2.js
          grep -q 'finaleRadius: 150' src/gameplay/arraialBrasil2.js
          grep -q 'Onda 2 introdutória' src/gameplay/waves.js
          grep -q 'holdDuration: kind' src/scenes/GameScene.js
          grep -q 'shieldDomeRadius: 110' src/gameplay/arraialBrasil2.js
          grep -q 'fireRingFlatten: 0.38' src/gameplay/arraialBrasil2.js
          grep -q 'Protótipo vetorial Phaser' src/scenes/GameScene.js
          grep -q 'Container não implementa setTintFill' src/scenes/GameScene.js
          grep -q 'showSpawnPortal' src/scenes/GameScene.js
          grep -q 'build-version' index.html
          grep -q 'showSpawnPortal(center,portalY' src/scenes/GameScene.js
          grep -q 'finalFormation' src/scenes/GameScene.js
          grep -q 'swarmHold' src/scenes/GameScene.js
          grep -q "Onda 2 usa apenas Tipo 1 e Tipo 2" tests/towers.test.js
          grep -q 'TESTAR UPGRADES V1' src/scenes/MenuScene.js
          ! grep -q "scene.start('LabSetupScene')" src/scenes/MenuScene.js
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install
      - name: Executar testes
        run: npm test
      - name: Compilar HTML autônomo para teste
        run: npm run build:itch
      - name: Preparar o GitHub Pages
        run: |
          mkdir -p pages-site
          cp itch-build/index.html pages-site/index.html
          touch pages-site/.nojekyll
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Empacotar página
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site
      - name: Publicar jogo
        id: deployment
        uses: actions/deploy-pages@v4
