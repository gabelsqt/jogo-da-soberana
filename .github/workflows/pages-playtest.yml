name: Playtest v0.50 — GitHub Pages

on:
  push:
    branches:
      - feat/brasil2-arraial-balístico
    paths:
      - 'src/**'
      - 'tests/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/pages-playtest.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: soberana-v050-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: soberana-v050-playtest
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar versão de teste (não publica outras branches)
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install
      # A suíte geral segue sendo executada no workflow "Verificação do protótipo".
      # O playtest publica independentemente de expectativas legadas obsoletas,
      # mas bloqueia se os testes críticos de gameplay atual falharem.
      - name: Testar mecânicas e HUD do playtest
        run: >
          node --test
          tests/sputnikRework.test.js
          tests/v1Specials.test.js
          tests/cuboNewsDomHud.test.js
          tests/russianFrost.test.js
          tests/russianDamageProgression.test.js
          tests/iceBreath.test.js
          tests/iceBreathBossDamage.test.js
          tests/type2Facing.test.js
          tests/type2SpriteSheet.test.js
          tests/type5SpriteSheet.test.js
          tests/type6HullSprite.test.js
          tests/type6ModuleSprite.test.js
          tests/music.test.js
      - name: Gerar HTML único do jogo
        run: npm run build:itch
      - name: Preparar página
        run: |
          mkdir -p pages-site
          cp itch-build/index.html pages-site/index.html
          touch pages-site/.nojekyll
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Carregar site
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
