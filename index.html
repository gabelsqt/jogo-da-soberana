<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#081426" />
    <title>Soberania — Protótipo</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #080f20;
      }
      body { font-family: system-ui, sans-serif; }
      /*
       * O Phaser recebe APENAS o #game sem padding. A moldura externa cuida
       * da safe area (notch, Dynamic Island e bordas) em iOS/Android.
       * 100dvh acompanha as barras móveis do navegador, com fallback em 100vh.
       */
      #viewport {
        box-sizing: border-box;
        position: relative;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        padding:
          env(safe-area-inset-top, 0px)
          env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px)
          env(safe-area-inset-left, 0px);
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
      #game {
        position: relative;
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #game canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* Aviso externo ao canvas: acessível antes dos controles touch futuros. */
      #rotate-notice {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        z-index: 20;
        padding:
          max(20px, env(safe-area-inset-top, 0px))
          max(20px, env(safe-area-inset-right, 0px))
          max(20px, env(safe-area-inset-bottom, 0px))
          max(20px, env(safe-area-inset-left, 0px));
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        background: #080f20;
        color: #e2f4ff;
      }
      #rotate-notice[hidden] { display: none !important; }
      #rotate-message {
        max-width: 360px;
        padding: 24px;
        border: 2px solid #59b9c9;
        border-radius: 14px;
        background: #101d31;
        box-shadow: 0 0 36px #317f9733;
      }
      #rotate-icon {
        display: block;
        font-size: 44px;
        margin-bottom: 12px;
        line-height: 1;
      }
      #rotate-title {
        display: block;
        font-size: clamp(18px, 5vw, 24px);
        font-weight: 800;
        margin-bottom: 10px;
      }
      #rotate-message p {
        margin: 0;
        font-size: clamp(13px, 3.4vw, 16px);
        line-height: 1.5;
        color: #bdd0e0;
      }
      .portrait-mode #game { visibility: hidden; }
      #build-version {
        position: fixed; right: 12px; bottom: 6px; z-index: 1000;
        font: 12px monospace; color: #a8c5d9;
        background: rgba(8, 15, 29, .75); padding: 3px 7px;
        border-radius: 4px; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <main id="viewport">
      <div id="game" aria-label="Jogo Soberania"></div>
      <div id="rotate-notice" role="status" aria-live="polite" hidden>
        <div id="rotate-message">
          <span id="rotate-icon" aria-hidden="true">↻</span>
          <strong id="rotate-title">Gire o celular para jogar</strong>
          <p>O Soberania foi desenvolvido para a tela horizontal. Vire o aparelho para continuar de onde parou.</p>
        </div>
      </div>
    </main>
    <div id="build-version" aria-label="Versão do jogo">v0.1.3</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
