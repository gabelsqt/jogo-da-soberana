<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#081426" />
    <title>Soberania — Protótipo</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #080f20;
      }
      body { font-family: system-ui, sans-serif; }
      /*
       * O Phaser recebe APENAS o #game sem padding. A moldura externa cuida
       * da safe area (notch, Dynamic Island e bordas) em iOS/Android.
       * 100dvh acompanha as barras móveis do navegador, com fallback em 100vh.
       */
      #viewport {
        box-sizing: border-box;
        position: relative;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        padding:
          env(safe-area-inset-top, 0px)
          env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px)
          env(safe-area-inset-left, 0px);
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
      /*
       * Composição separada: jogo Phaser 960×540; notícias independentes
       * abaixo do canvas (960×44). A escala é calculada por responsive.js.
       * Em menus e laboratórios a faixa não ocupa espaço.
       */
      #broadcast {
        position: relative;
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        width: 960px;
        height: 540px;
        min-width: 0;
        min-height: 0;
      }
      #game {
        position: relative;
        flex: none;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
      #cubo-news-overlay {
        box-sizing: border-box;
        position: relative;
        flex: none;
        width: 100%;
        height: 0;
        z-index: 30;
        pointer-events: none;
        overflow: visible;
        container-type: inline-size;
        font-family: Arial, Helvetica, sans-serif;
        isolation: isolate;
      }
      #cubo-news-overlay[hidden] { display: none !important; }
      .cubo-story {
        position: absolute;
        top: 0;
        left: 0;
        width: 78.5%;
        height: 55%;
        box-sizing: border-box;
        background: linear-gradient(180deg, #f4f4f5 0%, #bbbbbe 100%);
        box-shadow: inset 0 1px 0 #ffffffa0;
        border-left: 0.32cqw solid #c51d27;
        overflow: hidden;
        display: flex;
        align-items: center;
      }
      .cubo-label {
        position: absolute;
        top: -1.28cqw;
        left: 0;
        min-width: 13cqw;
        height: 1.65cqw;
        line-height: 1.65cqw;
        padding: 0 1.4cqw 0 0.9cqw;
        box-sizing: border-box;
        clip-path: polygon(0 0, 91% 0, 100% 100%, 0 100%);
        background: #cf1422;
        color: white;
        font-size: 1.22cqw;
        font-weight: 900;
        letter-spacing: -0.03em;
        white-space: nowrap;
        text-shadow: 0 1px 0 #81131a;
        z-index: 2;
      }
      .cubo-headline {
        padding: 0.45cqw 0 0.15cqw 0.65cqw;
        box-sizing: border-box;
        color: #222126;
        font-size: 1.52cqw;
        font-weight: 900;
        letter-spacing: -0.035em;
        line-height: 1.05;
        text-overflow: ellipsis;
        overflow: hidden;
        white-space: nowrap;
        width: 100%;
      }
      .cubo-crawl {
        position: absolute;
        top: 55%;
        left: 0;
        width: 78.5%;
        height: 45%;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        overflow: hidden;
        background: #bd091b;
        box-shadow: inset 0 1px 0 #f8555a66;
      }
      .cubo-crawl-track {
        width: max-content;
        display: flex;
        flex: none;
        align-items: center;
        white-space: nowrap;
        color: #fff;
        font-size: 1.1cqw;
        line-height: 1.15;
        font-weight: 700;
        text-shadow: 0 1px #55000f;
        will-change: transform;
        animation: cubo-scroll 12s linear infinite;
      }
      .cubo-crawl-track > span {
        flex: 0 0 auto;
        padding-right: 5cqw;
      }
      @keyframes cubo-scroll {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
      }
      .cubo-time {
        position: absolute;
        right: 1.5%;
        bottom: -0.1cqw;
        font-family: 'Arial Black', Impact, ui-monospace, monospace;
        font-size: 6.0cqw;
        line-height: 0.98;
        font-weight: 900;
        letter-spacing: -0.065em;
        font-variant-numeric: tabular-nums;
        color: rgba(239, 248, 255, 0.70);
        text-shadow: 0 0.17cqw 0.42cqw rgba(0, 0, 0, 0.84);
        white-space: nowrap;
        text-align: right;
      }
      #cubo-news-overlay.cubo-warning .cubo-time {
        color: rgba(255, 63, 79, 0.95);
        animation: cubo-warning-pulse 0.36s steps(2, jump-none) infinite;
      }
      #cubo-news-overlay.cubo-warning .cubo-crawl {
        background: #d10c20;
      }
      #cubo-news-overlay.cubo-warning .cubo-label { background: #ff2436; }
      @keyframes cubo-warning-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
      @media (prefers-reduced-motion: reduce) {
        .cubo-crawl-track { animation-duration: 24s; }
        #cubo-news-overlay.cubo-warning .cubo-time { animation: none; }
      }
      #game canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* Aviso externo ao canvas: acessível antes dos controles touch futuros. */
      #rotate-notice {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        z-index: 20;
        padding:
          max(20px, env(safe-area-inset-top, 0px))
          max(20px, env(safe-area-inset-right, 0px))
          max(20px, env(safe-area-inset-bottom, 0px))
          max(20px, env(safe-area-inset-left, 0px));
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        background: #080f20;
        color: #e2f4ff;
      }
      #rotate-notice[hidden] { display: none !important; }
      #rotate-message {
        max-width: 360px;
        padding: 24px;
        border: 2px solid #59b9c9;
        border-radius: 14px;
        background: #101d31;
        box-shadow: 0 0 36px #317f9733;
      }
      #rotate-icon {
        display: block;
        font-size: 44px;
        margin-bottom: 12px;
        line-height: 1;
      }
      #rotate-title {
        display: block;
        font-size: clamp(18px, 5vw, 24px);
        font-weight: 800;
        margin-bottom: 10px;
      }
      #rotate-message p {
        margin: 0;
        font-size: clamp(13px, 3.4vw, 16px);
        line-height: 1.5;
        color: #bdd0e0;
      }
      .portrait-mode #game { visibility: hidden; }
      #build-version {
        position: fixed; right: 12px; bottom: 6px; z-index: 1000;
        font: 12px monospace; color: #a8c5d9;
        background: rgba(8, 15, 29, .75); padding: 3px 7px;
        border-radius: 4px; pointer-events: none;
      }
      #build-version[hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main id="viewport">
      <div id="broadcast">
        <div id="game" aria-label="Jogo Soberania"></div>
        <section id="cubo-news-overlay" aria-label="Noticiário da Cubo News" hidden>
          <div class="cubo-story">
            <span id="cubo-headline" class="cubo-headline">INVASÃO ALIENÍGENA — PLANTÃO CUBO NEWS</span>
          </div>
          <div class="cubo-label">CUBO NEWS</div>
          <div class="cubo-crawl" aria-label="Subtítulo em movimento">
            <div id="cubo-crawl-track" class="cubo-crawl-track">
              <span id="cubo-crawl-one">Cubo News acompanha a defesa nacional ao vivo.</span>
              <span id="cubo-crawl-two" aria-hidden="true">Cubo News acompanha a defesa nacional ao vivo.</span>
            </div>
          </div>
          <div id="cubo-time" class="cubo-time" role="timer" aria-label="Tempo restante">00:30</div>
        </section>
      </div>
      <div id="rotate-notice" role="status" aria-live="polite" hidden>
        <div id="rotate-message">
          <span id="rotate-icon" aria-hidden="true">↻</span>
          <strong id="rotate-title">Gire o celular para jogar</strong>
          <p>O Soberania foi desenvolvido para a tela horizontal. Vire o aparelho para continuar de onde parou.</p>
        </div>
      </div>
    </main>
    <div id="build-version" aria-label="Versão do jogo">v0.1.6</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
