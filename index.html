<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#081426" />
    <title>Soberania — Protótipo</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #080f20;
      }
      body { font-family: system-ui, sans-serif; }
      /*
       * O Phaser recebe APENAS o #game sem padding. A moldura externa cuida
       * da safe area (notch, Dynamic Island e bordas) em iOS/Android.
       * 100dvh acompanha as barras móveis do navegador, com fallback em 100vh.
       */
      #viewport {
        box-sizing: border-box;
        position: relative;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        padding:
          env(safe-area-inset-top, 0px)
          env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px)
          env(safe-area-inset-left, 0px);
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
      /*
       * Composição separada: jogo Phaser 960×540; notícias independentes
       * abaixo do canvas (960×44). A escala é calculada por responsive.js.
       * Em menus e laboratórios a faixa não ocupa espaço.
       */
      #broadcast {
        position: relative;
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        width: 960px;
        height: 540px;
        min-width: 0;
        min-height: 0;
      }
      #game {
        position: relative;
        flex: none;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
      #cubo-news-overlay {
        box-sizing: border-box;
        position: relative;
        flex: none;
        width: 100%;
        height: 0;
        z-index: 30;
        pointer-events: none;
        overflow: visible;
        container-type: inline-size;
        font-family: monospace;
        isolation: isolate;
      }
      #cubo-news-overlay[hidden] { display: none !important; }
      .cubo-story {
        position: absolute;
        top: 0;
        left: 0;
        width: 78.5%;
        height: 55%;
        box-sizing: border-box;
        background: #c5cbd5;
        border-top: 0.2cqw solid #f4f7fd;
        border-bottom: 0.25cqw solid #53637c;
        border-left: 0.42cqw solid #c51d27;
        overflow: hidden;
        display: flex;
        align-items: center;
      }
      .cubo-label {
        position: absolute;
        top: 0.12cqw;
        left: 0.25cqw;
        min-width: 13cqw;
        height: 1.65cqw;
        line-height: 1.65cqw;
        padding: 0 1.4cqw 0 0.9cqw;
        box-sizing: border-box;
        clip-path: polygon(0 0, 94% 0, 94% 25%, 100% 25%, 100% 76%, 94% 76%, 94% 100%, 0 100%);
        background: #cb172e;
        color: white;
        font-size: 1.22cqw;
        font-weight: 900;
        letter-spacing: -0.03em;
        white-space: nowrap;
        text-shadow: 0 1px 0 #81131a;
        z-index: 2;
      }
      .cubo-headline {
        padding: 0.45cqw 0 0.15cqw 0.65cqw;
        box-sizing: border-box;
        color: #222126;
        font-size: 1.52cqw;
        font-weight: 900;
        letter-spacing: -0.035em;
        line-height: 1.05;
        text-overflow: ellipsis;
        overflow: hidden;
        white-space: nowrap;
        width: 100%;
      }
      .cubo-crawl {
        position: absolute;
        top: 55%;
        left: 0;
        width: 78.5%;
        height: 45%;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        overflow: hidden;
        background: #bd091b;
        border-top: 0.16cqw solid #ff7080;
      }
      .cubo-crawl-track {
        width: max-content;
        display: flex;
        flex: none;
        align-items: center;
        white-space: nowrap;
        color: #fff;
        font-size: 1.1cqw;
        line-height: 1.15;
        font-weight: 700;
        text-shadow: 0 1px #55000f;
        will-change: transform;
        animation: cubo-scroll 12s linear infinite;
      }
      .cubo-crawl-track > span {
        flex: 0 0 auto;
        padding-right: 5cqw;
      }
      @keyframes cubo-scroll {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
      }
      .cubo-time {
        position: absolute;
        right: 0.6%;
        bottom: -0.25cqw;
        font-family: monospace;
        image-rendering: pixelated;
        color: rgba(239, 248, 255, 0.70);
        filter: drop-shadow(0.25cqw 0.25cqw 0 #060b18);
        white-space: nowrap;
        text-align: right;
      }
      #cubo-news-overlay.cubo-warning .cubo-time {
        animation: cubo-warning-pulse 0.36s steps(2, jump-none) infinite;
      }
      #cubo-news-overlay.cubo-warning .cubo-crawl {
        background: #d10c20;
      }
      #cubo-news-overlay.cubo-warning .cubo-label { background: #ff2436; }
      @keyframes cubo-warning-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
      @media (prefers-reduced-motion: reduce) {
        .cubo-crawl-track { animation-duration: 24s; }
        #cubo-news-overlay.cubo-warning .cubo-time { animation: none; }
      }

      /* Retrô com legibilidade: bordas e blocos de telejornal pixel art, mas
         letras HTML nítidas (a matriz bitmap 5×7 era difícil de ler). */
      .cubo-label-text {
        display: block;
        font-family: Consolas, 'Lucida Console', monospace;
        font-size: 1.22cqw;
        font-weight: 900;
        line-height: 1.65cqw;
        letter-spacing: -0.025em;
        color: #ffffff;
        white-space: nowrap;
        text-shadow: 0.1cqw 0.1cqw #761420;
      }
      .cubo-headline {
        position: absolute;
        left: 13.5cqw;
        top: 50%;
        transform: translateY(-50%);
        max-width: calc(100% - 14.1cqw);
        display: block;
        font-family: Consolas, 'Lucida Console', monospace;
        font-weight: 900;
        font-size: 1.48cqw;
        line-height: 1.25;
        letter-spacing: -0.015em;
        color: #15202b;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        text-rendering: optimizeLegibility;
      }
      .cubo-crawl-track {
        height: 100%;
        font-size: 1.22cqw;
        letter-spacing: 0.005em;
        line-height: 1;
      }
      .cubo-crawl-text {
        display: inline-flex;
        align-items: center;
        height: 100%;
        padding: 0 5cqw 0 0.8cqw;
        white-space: nowrap;
        font-family: Consolas, 'Lucida Console', monospace;
        font-size: 1.22cqw;
        font-weight: 700;
        color: #ffffff;
        box-sizing: border-box;
      }
      .cubo-time {
        font-family: 'Arial Black', Impact, system-ui, sans-serif;
        font-variant-numeric: tabular-nums;
        font-size: 9.4cqw;
        line-height: 1;
        font-weight: 900;
        letter-spacing: -0.055em;
        color: rgba(234, 246, 255, 0.77);
        text-shadow: 0.2cqw 0.2cqw #020916;
        filter: none;
        transition: opacity 180ms ease-out;
      }
      #cubo-time-reader {
        display: inline-block;
        min-width: 1.3em;
        text-align: right;
      }
      #cubo-dawn-intro {
        position: absolute;
        inset: 0 0 auto 0;
        width: 100%;
        height: 92.46575%;
        z-index: 40;
        pointer-events: none;
        container-type: inline-size;
        overflow: visible;
      }
      #cubo-dawn-intro[hidden] { display: none !important; }
      .cubo-dawn-frame {
        position: absolute;
        left: 20%;
        top: 22%;
        width: 60%;
        height: 60%;
        background: rgba(5, 16, 33, 0.75);
        border: 0.38cqw solid #72cbe8;
        box-shadow: 0.9cqw 0.9cqw 0 #040b16;
        opacity: 1;
        transition: opacity 750ms ease-in-out;
      }
      #cubo-dawn-label {
        position: absolute;
        left: 50%;
        top: 38%;
        transform: translate(-50%, -50%);
        width: 90%;
        text-align: center;
        font-family: Consolas, 'Lucida Console', monospace;
        font-size: 3.1cqw;
        font-weight: 900;
        letter-spacing: 0.035em;
        color: #b1f6ff;
        text-shadow: 0.28cqw 0.28cqw #03101c;
        white-space: nowrap;
        opacity: 1;
        transition: opacity 850ms ease-in-out;
      }
      #cubo-dawn-number {
        position: absolute;
        left: 50%;
        top: 55%;
        display: block;
        min-width: 29cqw;
        text-align: center;
        font-family: 'Arial Black', Impact, system-ui, sans-serif;
        font-size: 25cqw;
        line-height: 0.96;
        letter-spacing: -0.07em;
        font-variant-numeric: tabular-nums;
        font-weight: 900;
        color: #ffffff;
        text-shadow: 0.8cqw 0.8cqw #051122;
        transform: translate(-50%, -50%);
        transform-origin: center center;
        white-space: nowrap;
        opacity: 1;
        will-change: transform, opacity;
      }
      #cubo-dawn-intro.cubo-dawn-traveling .cubo-dawn-frame,
      #cubo-dawn-intro.cubo-dawn-traveling #cubo-dawn-label {
        opacity: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        #cubo-dawn-number { will-change: auto; }
      }
      /* Canvas 5×7 com minúsculas legíveis e escala nearest-neighbour. */
      .cubo-accessible {
        position: absolute; width: 1px; height: 1px; margin: -1px;
        padding: 0; overflow: hidden; clip: rect(0,0,0,0);
        white-space: nowrap;
      }
      #cubo-label-pixels, #cubo-headline-pixels, .cubo-crawl-pixels,
      #cubo-time-pixels, #cubo-dawn-label, #cubo-dawn-number {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #cubo-label-pixels {
        width: 10.9cqw; height: 1.65cqw;
      }
      #cubo-headline-pixels {
        position: absolute;
        left: 13.0cqw; top: 50%; transform: translateY(-50%);
        max-width: calc(100% - 13.5cqw);
        height: 2.0cqw;
      }
      .cubo-crawl-track {height: 100%;font-size: 0;}
      .cubo-crawl-pixels {height: 1.55cqw;align-self: center;flex-shrink: 0;}
      #cubo-time-pixels {width: 17.8cqw;height: 11.1cqw;opacity: 0.78;}
      #cubo-dawn-label {
        position: absolute;left: 50%;top: 38%;
        width: 43cqw;height: 3.35cqw;transform: translate(-50%,-50%);
      }
      #cubo-dawn-number {
        position: absolute;left: 50%;top: 55%;
        width: 32cqw;height: 20.1cqw;
        transform: translate(-50%,-50%);transform-origin: center center;
        filter: drop-shadow(0.6cqw 0.6cqw 0 #051122);
        opacity: 1;will-change: transform,opacity;
      }
      #game canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* Aviso externo ao canvas: acessível antes dos controles touch futuros. */
      #rotate-notice {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        z-index: 20;
        padding:
          max(20px, env(safe-area-inset-top, 0px))
          max(20px, env(safe-area-inset-right, 0px))
          max(20px, env(safe-area-inset-bottom, 0px))
          max(20px, env(safe-area-inset-left, 0px));
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        background: #080f20;
        color: #e2f4ff;
      }
      #rotate-notice[hidden] { display: none !important; }
      #rotate-message {
        max-width: 360px;
        padding: 24px;
        border: 2px solid #59b9c9;
        border-radius: 14px;
        background: #101d31;
        box-shadow: 0 0 36px #317f9733;
      }
      #rotate-icon {
        display: block;
        font-size: 44px;
        margin-bottom: 12px;
        line-height: 1;
      }
      #rotate-title {
        display: block;
        font-size: clamp(18px, 5vw, 24px);
        font-weight: 800;
        margin-bottom: 10px;
      }
      #rotate-message p {
        margin: 0;
        font-size: clamp(13px, 3.4vw, 16px);
        line-height: 1.5;
        color: #bdd0e0;
      }
      .portrait-mode #game { visibility: hidden; }
      #build-version {
        position: fixed; right: 12px; bottom: 6px; z-index: 1000;
        font: 12px monospace; color: #a8c5d9;
        background: rgba(8, 15, 29, .75); padding: 3px 7px;
        border-radius: 4px; pointer-events: none;
      }
      #build-version[hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main id="viewport">
      <div id="broadcast">
        <div id="game" aria-label="Jogo Soberania"></div>
        <section id="cubo-news-overlay" aria-label="Noticiário da Cubo News" hidden>
          <div class="cubo-story">
            <span id="cubo-headline" class="cubo-accessible">Invasão alienígena — plantão Cubo News</span>
            <canvas id="cubo-headline-pixels" aria-hidden="true"></canvas>
          </div>
          <div class="cubo-label">
            <span class="cubo-accessible">Cubo News</span>
            <canvas id="cubo-label-pixels" aria-hidden="true"></canvas>
          </div>
          <div class="cubo-crawl" aria-label="Subtítulo em movimento">
            <div id="cubo-crawl-track" class="cubo-crawl-track">
              <span id="cubo-crawl-one" class="cubo-accessible">Cubo News acompanha a defesa nacional ao vivo.</span>
              <canvas id="cubo-crawl-one-pixels" class="cubo-crawl-pixels" aria-hidden="true"></canvas>
              <span id="cubo-crawl-two" class="cubo-accessible" aria-hidden="true">Cubo News acompanha a defesa nacional ao vivo.</span>
              <canvas id="cubo-crawl-two-pixels" class="cubo-crawl-pixels" aria-hidden="true"></canvas>
            </div>
          </div>
          <div id="cubo-time" class="cubo-time" role="timer" aria-label="Tempo restante: 30 segundos">
            <span id="cubo-time-reader" class="cubo-accessible">30</span>
            <canvas id="cubo-time-pixels" aria-hidden="true"></canvas>
          </div>
        </section>
        <div id="cubo-dawn-intro" aria-hidden="true" hidden>
          <div class="cubo-dawn-frame"></div>
          <canvas id="cubo-dawn-label" aria-hidden="true"></canvas>
          <canvas id="cubo-dawn-number" aria-hidden="true"></canvas>
        </div>
      </div>
      <div id="rotate-notice" role="status" aria-live="polite" hidden>
        <div id="rotate-message">
          <span id="rotate-icon" aria-hidden="true">↻</span>
          <strong id="rotate-title">Gire o celular para jogar</strong>
          <p>O Soberania foi desenvolvido para a tela horizontal. Vire o aparelho para continuar de onde parou.</p>
        </div>
      </div>
    </main>
    <div id="build-version" aria-label="Versão do jogo">v0.1.6</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
